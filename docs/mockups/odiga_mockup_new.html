<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오디가 — 홈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --yellow: #FFD663;
    --yellow-light: #FFF8DC;
    --yellow-bg: #FFFCF0;
    --black: #1A1A1A;
    --gray: #888;
    --gray-light: #F5F5F3;
    --border: #EBEBEB;
    --white: #ffffff;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #F0EDE6;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 16px;
  }

  .phone {
    width: 375px;
    background: var(--white);
    border-radius: 44px;
    overflow: hidden;
    box-shadow: 0 40px 100px rgba(0,0,0,0.14), 0 0 0 1px rgba(0,0,0,0.06);
  }

  /* 상단 노치 */
  .notch {
    background: var(--white);
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .notch-bar {
    width: 120px;
    height: 5px;
    background: #1a1a1a;
    border-radius: 100px;
    opacity: 0.12;
  }

  .screen {
    padding: 4px 22px 40px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* 헤더 */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0 4px;
  }
  .logo-area {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-bubble {
    width: 42px;
    height: 33px;
  }
  .logo-text {
    font-size: 24px;
    font-weight: 900;
    color: var(--black);
    letter-spacing: -1.5px;
    line-height: 1;
  }
  .header-right {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--gray-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  /* 인사 */
  .greeting {
    padding: 4px 0 0;
  }
  .greeting-main {
    font-size: 22px;
    font-weight: 900;
    color: var(--black);
    letter-spacing: -0.8px;
    line-height: 1.3;
  }
  .greeting-main em {
    font-style: normal;
    background: var(--yellow);
    padding: 0 4px 1px;
    border-radius: 6px;
  }
  .greeting-sub {
    margin-top: 5px;
    font-size: 13px;
    color: var(--gray);
    font-weight: 400;
  }

  /* 카드 공통 */
  .card {
    background: var(--white);
    border-radius: 20px;
    border: 1.5px solid var(--border);
    padding: 18px 16px;
  }
  .card-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--gray);
    margin-bottom: 12px;
    letter-spacing: 0.3px;
  }

  /* 지역 탭 */
  .region-row {
    display: flex;
    gap: 8px;
  }
  .region-btn {
    flex: 1;
    padding: 11px 0;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 700;
    border: 1.5px solid var(--border);
    background: var(--gray-light);
    color: var(--gray);
    font-family: inherit;
    cursor: pointer;
    transition: all .15s;
  }
  .region-btn.on {
    background: var(--yellow);
    border-color: var(--yellow);
    color: var(--black);
  }

  /* 무드 칩 */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }
  .chip {
    padding: 8px 14px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 700;
    border: 1.5px solid var(--border);
    background: var(--gray-light);
    color: var(--gray);
    font-family: inherit;
    cursor: pointer;
  }
  .chip.on {
    background: var(--yellow-light);
    border-color: var(--yellow);
    color: var(--black);
  }

  /* 시간 */
  .time-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .time-box {
    flex: 1;
    background: var(--yellow-bg);
    border: 1.5px solid var(--yellow);
    border-radius: 14px;
    padding: 13px 0;
    text-align: center;
    font-size: 16px;
    font-weight: 900;
    color: var(--black);
    letter-spacing: -0.5px;
  }
  .time-sep {
    font-size: 14px;
    color: #ccc;
    font-weight: 400;
  }

  /* 핫플 미리보기 */
  .spots-row {
    display: flex;
    gap: 10px;
    overflow: hidden;
  }
  .spot-card {
    flex: 1;
    background: var(--gray-light);
    border-radius: 16px;
    padding: 14px 12px;
    position: relative;
    overflow: hidden;
  }
  .spot-tag {
    display: inline-block;
    background: var(--yellow);
    color: var(--black);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 100px;
    margin-bottom: 8px;
  }
  .spot-name {
    font-size: 14px;
    font-weight: 900;
    color: var(--black);
    letter-spacing: -0.3px;
    margin-bottom: 2px;
  }
  .spot-desc {
    font-size: 12px;
    color: var(--gray);
    font-weight: 400;
  }
  .spot-emoji {
    position: absolute;
    bottom: 10px;
    right: 12px;
    font-size: 24px;
    opacity: 0.6;
  }

  /* CTA */
  .cta {
    width: 100%;
    padding: 18px;
    border-radius: 18px;
    background: var(--black);
    color: var(--yellow);
    font-size: 16px;
    font-weight: 900;
    font-family: inherit;
    border: none;
    cursor: pointer;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .cta-arrow {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--yellow);
    color: var(--black);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    font-size: 14px;
  }

  /* 하단 네비 */
  .nav {
    margin: 0 -22px -40px;
    padding: 14px 32px 28px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 700;
    color: #bbb;
  }
  .nav-item.on { color: var(--black); }
  .nav-icon {
    width: 24px;
    height: 24px;
    border-radius: 8px;
    background: var(--gray-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }
  .nav-item.on .nav-icon {
    background: var(--yellow);
  }
</style>
</head>
<body>

<div class="phone">
  <div class="notch"><div class="notch-bar"></div></div>
  <div class="screen">

    <!-- 헤더 -->
    <div class="header">
      <div class="logo-area">
        <svg class="logo-bubble" viewBox="0 0 110 85" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M28 14C42 9 58 7 72 8C86 9 98 13 104 20C110 27 110 38 108 50C106 62 100 72 90 76C78 80 58 82 44 80C38 88 34 96 32 102C30 94 28 86 26 80C18 76 12 68 10 56C8 44 8 30 14 20C18 15 22 16 28 14Z" fill="white" stroke="#1a1a1a" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="logo-text">오디가</span>
      </div>
      <div class="header-right">🔔</div>
    </div>

    <!-- 인사 -->
    <div class="greeting">
      <div class="greeting-main">오늘 <em>홍대</em> 어때요?</div>
      <div class="greeting-sub">날씨 맑음 · 22도 · 산책하기 딱 좋은 날</div>
    </div>

    <!-- 지역 -->
    <div class="card">
      <div class="card-title">📍 어디로 갈까요?</div>
      <div class="region-row">
        <button class="region-btn">성수</button>
        <button class="region-btn on">홍대</button>
        <button class="region-btn">연남</button>
        <button class="region-btn">이태원</button>
      </div>
    </div>

    <!-- 무드 -->
    <div class="card">
      <div class="card-title">🏷️ 오늘의 무드</div>
      <div class="chips">
        <button class="chip on">감성</button>
        <button class="chip on">카페</button>
        <button class="chip">힙한</button>
        <button class="chip">디저트</button>
        <button class="chip">빈티지</button>
        <button class="chip">포토스팟</button>
        <button class="chip">존맛</button>
      </div>
    </div>

    <!-- 시간 -->
    <div class="card">
      <div class="card-title">🕐 몇 시부터 몇 시까지?</div>
      <div class="time-row">
        <div class="time-box">12:00</div>
        <span class="time-sep">—</span>
        <div class="time-box">18:00</div>
      </div>
    </div>

    <!-- 핫플 미리보기 -->
    <div class="card">
      <div class="card-title">✨ 요즘 뜨는 곳</div>
      <div class="spots-row">
        <div class="spot-card">
          <div class="spot-tag">카페</div>
          <div class="spot-name">앤트러사이트</div>
          <div class="spot-desc">홍대 · 감성 인테리어</div>
          <div class="spot-emoji">☕</div>
        </div>
        <div class="spot-card">
          <div class="spot-tag">디저트</div>
          <div class="spot-name">몽중헌</div>
          <div class="spot-desc">홍대 · 빙수 맛집</div>
          <div class="spot-emoji">🍧</div>
        </div>
      </div>
    </div>

    <!-- CTA -->
    <button class="cta">
      코스 짜러 가기
      <span class="cta-arrow">→</span>
    </button>

    <!-- 하단 네비 -->
    <div class="nav">
      <div class="nav-item on">
        <div class="nav-icon">🗺️</div>
        홈
      </div>
      <div class="nav-item">
        <div class="nav-icon">🔍</div>
        탐색
      </div>
      <div class="nav-item">
        <div class="nav-icon">📋</div>
        내 코스
      </div>
      <div class="nav-item">
        <div class="nav-icon">👤</div>
        마이
      </div>
    </div>

  </div>
</div>

</body>
</html>
